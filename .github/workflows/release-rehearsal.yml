name: release-rehearsal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version without a leading v.
        required: true
        type: string
      tag:
        description: Exact release tag, equal to v plus the version.
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit to build and release.
        required: true
        type: string
      approved_manifest_base64:
        description: Bounded base64-encoded approved release manifest bytes.
        required: true
        type: string
      approved_manifest_digest:
        description: SHA-256 of the decoded approved release manifest bytes.
        required: true
        type: string
      dry_run:
        description: Build private candidates and an immutable plan without publication.
        required: true
        default: true
        type: boolean
      expected_plan_digest:
        description: Required for live publication and bound to a prior exact rehearsal plan.
        required: false
        default: ""
        type: string
      exact_confirmation:
        description: Required for live publication and bound to every release identity input.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate-inputs:
    name: bind-source-manifest-and-release-notes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1

      - name: Decode and validate approved manifest
        shell: bash
        env:
          APPROVED_MANIFEST_BASE64: ${{ inputs.approved_manifest_base64 }}
          APPROVED_MANIFEST_DIGEST: ${{ inputs.approved_manifest_digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXACT_CONFIRMATION: ${{ inputs.exact_confirmation }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "invalid version" >&2; exit 1; }
          [[ "$TAG" == "v$VERSION" ]] || { echo "tag must equal v plus version" >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid source commit" >&2; exit 1; }
          [[ "$APPROVED_MANIFEST_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid manifest digest" >&2; exit 1; }
          [[ "${#APPROVED_MANIFEST_BASE64}" -le 16384 ]] || { echo "manifest input exceeds bound" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || { echo "checkout source drift" >&2; exit 1; }
          [[ "$WORKFLOW_SHA" == "$SOURCE_COMMIT" ]] || { echo "workflow source drift" >&2; exit 1; }
          if [[ "$DRY_RUN" == "false" ]]; then
            [[ "$EXPECTED_PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "live publication requires plan digest" >&2; exit 1; }
            expected_confirmation="publish-ao-sentinel-$VERSION-$TAG-$SOURCE_COMMIT-$APPROVED_MANIFEST_DIGEST-$EXPECTED_PLAN_DIGEST"
            [[ "$EXACT_CONFIRMATION" == "$expected_confirmation" ]] || { echo "live publication confirmation mismatch" >&2; exit 1; }
          elif [[ "$DRY_RUN" != "true" ]]; then
            echo "invalid dry run value" >&2
            exit 1
          elif [[ -n "$EXPECTED_PLAN_DIGEST" || -n "$EXACT_CONFIRMATION" ]]; then
            echo "dry run must not include live publication inputs" >&2
            exit 1
          fi
          mkdir -p approved-manifest
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          encoded = os.environ["APPROVED_MANIFEST_BASE64"]
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"approved manifest is not strict base64: {error}")
          if not decoded or len(decoded) > 12288 or b"\0" in decoded:
              raise SystemExit("decoded approved manifest is empty, oversized, or contains NUL")
          Path("approved-manifest/approved-release-manifest.json").write_bytes(decoded)
          PY
          actual_digest=$(python3 -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("approved-manifest/approved-release-manifest.json").read_bytes()).hexdigest())')
          [[ "$actual_digest" == "$APPROVED_MANIFEST_DIGEST" ]] || { echo "manifest digest mismatch" >&2; exit 1; }
          python3 - approved-manifest/approved-release-manifest.json <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          required = {"schema_version", "repository", "version", "tag", "source_commit", "release_notes_path", "release_notes_sha256", "targets"}
          if set(value) != required or value["schema_version"] != "ao.sentinel.release-manifest.v0.1":
              raise SystemExit("manifest shape or schema mismatch")
          for key, expected in {"repository": "ao-sentinel", "version": os.environ["VERSION"], "tag": os.environ["TAG"], "source_commit": os.environ["SOURCE_COMMIT"]}.items():
              if value.get(key) != expected:
                  raise SystemExit(f"manifest {key} mismatch")
          notes = Path(value["release_notes_path"])
          if notes.is_absolute() or ".." in notes.parts or notes != Path(f"docs/release/V{os.environ['VERSION']}-OPERATOR-CLOSEOUT.md") or not notes.is_file():
              raise SystemExit("manifest release-notes path mismatch")
          digest = hashlib.sha256(notes.read_bytes()).hexdigest()
          if not re.fullmatch(r"[0-9a-f]{64}", value["release_notes_sha256"]) or digest != value["release_notes_sha256"]:
              raise SystemExit("manifest release-notes digest mismatch")
          PY
          python3 scripts/release-rehearsal-verify.py validate-manifest --manifest approved-manifest/approved-release-manifest.json

      - name: Upload immutable approved manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ao-sentinel-approved-release-manifest-${{ inputs.source_commit }}
          path: approved-manifest/approved-release-manifest.json
          overwrite: false
          if-no-files-found: error

  build-candidate:
    name: native-candidate (${{ matrix.target_label }})
    needs: validate-inputs
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_label: linux-x86_64
            archive_extension: tar.gz
            binary_suffix: ""
            expected_runner_arch: X64
            expected_goos: linux
            expected_goarch: amd64
            expected_executable_format: elf
          - os: macos-15
            target_label: macos-aarch64
            archive_extension: tar.gz
            binary_suffix: ""
            expected_runner_arch: ARM64
            expected_goos: darwin
            expected_goarch: arm64
            expected_executable_format: macho
          - os: windows-2025
            target_label: windows-x86_64
            archive_extension: zip
            binary_suffix: ".exe"
            expected_runner_arch: X64
            expected_goos: windows
            expected_goarch: amd64
            expected_executable_format: pe
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download bound approved manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ao-sentinel-approved-release-manifest-${{ inputs.source_commit }}
          path: approved-manifest

      - name: Build, test, package, and bind native candidate
        shell: bash
        env:
          APPROVED_MANIFEST_DIGEST: ${{ inputs.approved_manifest_digest }}
          ARCHIVE_EXTENSION: ${{ matrix.archive_extension }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
          EXPECTED_EXECUTABLE_FORMAT: ${{ matrix.expected_executable_format }}
          EXPECTED_GOARCH: ${{ matrix.expected_goarch }}
          EXPECTED_GOOS: ${{ matrix.expected_goos }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
          TARGET_LABEL: ${{ matrix.target_label }}
          VERSION: ${{ inputs.version }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || { echo "candidate source drift" >&2; exit 1; }
          [[ "$WORKFLOW_SHA" == "$SOURCE_COMMIT" ]] || { echo "candidate workflow drift" >&2; exit 1; }
          [[ "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]] || { echo "runner architecture mismatch" >&2; exit 1; }
          [[ "$(go env GOOS)" == "$EXPECTED_GOOS" ]] || { echo "native GOOS mismatch" >&2; exit 1; }
          [[ "$(go env GOARCH)" == "$EXPECTED_GOARCH" ]] || { echo "native GOARCH mismatch" >&2; exit 1; }
          actual_manifest=$(python3 -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("approved-manifest/approved-release-manifest.json").read_bytes()).hexdigest())')
          [[ "$actual_manifest" == "$APPROVED_MANIFEST_DIGEST" ]] || { echo "candidate manifest digest mismatch" >&2; exit 1; }
          candidate_dir="target/release-rehearsal/$TARGET_LABEL"
          binary="ao-sentinel${BINARY_SUFFIX}"
          archive="ao-sentinel-$VERSION-$TARGET_LABEL.$ARCHIVE_EXTENSION"
          mkdir -p "$candidate_dir"
          go test ./... -count=1
          go vet ./...
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/uesugitorachiyo/ao-sentinel/internal/cli.buildVersion=$VERSION -X github.com/uesugitorachiyo/ao-sentinel/internal/cli.buildSourceCommit=$SOURCE_COMMIT" \
            -o "$candidate_dir/$binary" ./cmd/sentinel
          "$candidate_dir/$binary" --help > "$candidate_dir/help-smoke.txt"
          "$candidate_dir/$binary" version --json > "$candidate_dir/version-readback.json"
          "$candidate_dir/$binary" target validate --target examples/targets/valid/local-ao-stack.sentinel-target.json > "$candidate_dir/functional-smoke.txt"
          grep -Fx 'target validation: passed' "$candidate_dir/functional-smoke.txt"
          cp LICENSE NOTICE "$candidate_dir/"
          go list -m -json all > "$candidate_dir/sbom.json"
          CANDIDATE_DIR="$candidate_dir" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["CANDIDATE_DIR"])
          version = json.loads((root / "version-readback.json").read_text(encoding="utf-8"))
          expected = {"schema_version": "ao.sentinel.version.v0.1", "version": os.environ["VERSION"], "source_commit": os.environ["SOURCE_COMMIT"], "provider_calls": False}
          if version != expected:
              raise SystemExit("built binary version identity mismatch")
          smoke = {"schema_version": "ao.sentinel.release-functional-smoke.v0.1", "command": "target validate", "status": "passed", "provider_calls": False}
          (root / "functional-smoke.json").write_text(json.dumps(smoke, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          provenance = {"schema_version": "ao.sentinel.release-candidate-provenance.v0.1", "repository": "ao-sentinel", "version": os.environ["VERSION"], "source_commit": os.environ["SOURCE_COMMIT"], "target_label": os.environ["TARGET_LABEL"], "binary_format": os.environ["EXPECTED_EXECUTABLE_FORMAT"], "provider_calls": False, "workflow_identity": ".github/workflows/release-rehearsal.yml@" + os.environ["SOURCE_COMMIT"]}
          (root / "provenance.json").write_text(json.dumps(provenance, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          CANDIDATE_DIR="$candidate_dir" ARCHIVE="$archive" BINARY="$binary" python3 - <<'PY'
          import gzip, hashlib, io, json, os, tarfile, zipfile
          from pathlib import Path
          root = Path(os.environ["CANDIDATE_DIR"])
          archive = root / os.environ["ARCHIVE"]
          names = [os.environ["BINARY"], "LICENSE", "NOTICE", "version-readback.json", "provenance.json", "functional-smoke.json", "sbom.json"]
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  for name in names:
                      info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                      info.external_attr = ((0o755 if name == os.environ["BINARY"] else 0o644) & 0xFFFF) << 16
                      output.writestr(info, (root / name).read_bytes())
          else:
              with archive.open("wb") as raw, gzip.GzipFile(filename="", fileobj=raw, mode="wb", mtime=0) as compressed:
                  with tarfile.open(fileobj=compressed, mode="w") as output:
                      for name in names:
                          data = (root / name).read_bytes()
                          info = tarfile.TarInfo(name)
                          info.size, info.mtime, info.uid, info.gid = len(data), 0, 0, 0
                          info.mode = 0o755 if name == os.environ["BINARY"] else 0o644
                          output.addfile(info, io.BytesIO(data))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          summary = {"schema_version": "ao.sentinel.release-candidate.v0.1", "target_label": os.environ["TARGET_LABEL"], "archive": archive.name, "archive_sha256": digest, "binary": os.environ["BINARY"], "binary_format": os.environ["EXPECTED_EXECUTABLE_FORMAT"], "goos": os.environ["EXPECTED_GOOS"], "goarch": os.environ["EXPECTED_GOARCH"], "repository": "ao-sentinel", "version": os.environ["VERSION"], "tag": os.environ["TAG"], "source_commit": os.environ["SOURCE_COMMIT"]}
          (root / "candidate.json").write_text(json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          (root / os.environ["BINARY"]).unlink()
          (root / "functional-smoke.txt").unlink()
          (root / "help-smoke.txt").unlink()
          PY

      - name: Upload immutable private candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ao-sentinel-release-candidate-${{ matrix.target_label }}-${{ inputs.source_commit }}
          path: target/release-rehearsal/${{ matrix.target_label }}
          overwrite: false
          if-no-files-found: error

  assemble-plan:
    name: verify-candidates-and-assemble-immutable-plan
    needs: [validate-inputs, build-candidate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
      - name: Download approved manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ao-sentinel-approved-release-manifest-${{ inputs.source_commit }}
          path: approved-manifest
      - name: Download exact native candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ao-sentinel-release-candidate-*-${{ inputs.source_commit }}
          path: downloaded-candidates
      - name: Strictly verify candidates and emit plan
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || { echo "plan verifier source drift" >&2; exit 1; }
          python3 scripts/release-rehearsal-verify.py assemble --manifest approved-manifest/approved-release-manifest.json --candidates downloaded-candidates --out target/release-rehearsal-plan --dry-run "$DRY_RUN" --expected-plan-digest "$EXPECTED_PLAN_DIGEST"
      - name: Upload immutable private rehearsal plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ao-sentinel-release-rehearsal-plan-${{ inputs.source_commit }}
          path: target/release-rehearsal-plan
          overwrite: false
          if-no-files-found: error

  live-preflight:
    name: require-protected-release-environment
    needs: validate-inputs
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify preconfigured reviewer protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json=$(gh api "repos/$GITHUB_REPOSITORY/environments/ao-sentinel-release")
          ENVIRONMENT_JSON="$environment_json" python3 - <<'PY'
          import json, os
          value = json.loads(os.environ["ENVIRONMENT_JSON"])
          reviewers = [rule for rule in value.get("protection_rules", []) if isinstance(rule, dict) and rule.get("type") == "required_reviewers"]
          if value.get("name") != "ao-sentinel-release" or not reviewers or not any(rule.get("reviewers") for rule in reviewers):
              raise SystemExit("ao-sentinel-release is absent or lacks required reviewers")
          PY

  publish:
    name: protected-live-publish
    needs: [validate-inputs, live-preflight, assemble-plan]
    if: ${{ inputs.dry_run == false && needs.validate-inputs.result == 'success' && needs.live-preflight.result == 'success' && needs.assemble-plan.result == 'success' && inputs.exact_confirmation == format('publish-ao-sentinel-{0}-{1}-{2}-{3}-{4}', inputs.version, inputs.tag, inputs.source_commit, inputs.approved_manifest_digest, inputs.expected_plan_digest) }}
    runs-on: ubuntu-24.04
    environment: ao-sentinel-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
      - name: Download bound inputs and candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ao-sentinel-*-${{ inputs.source_commit }}
          path: release-inputs
      - name: Reverify plan and remote absence
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || { echo "publisher source drift" >&2; exit 1; }
          plan=$(find release-inputs -name immutable-promotion-plan.json -print -quit)
          manifest=$(find release-inputs -name approved-release-manifest.json -print -quit)
          [[ -n "$plan" && -n "$manifest" ]] || { echo "required release inputs missing" >&2; exit 1; }
          python3 scripts/release-rehearsal-verify.py verify --manifest "$manifest" --candidates release-inputs --plan "$plan" --dry-run "$DRY_RUN" --expected-plan-digest "$EXPECTED_PLAN_DIGEST"
          [[ -z "$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")" ]] || { echo "remote tag already exists" >&2; exit 1; }
          set +e
          release_response=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)
          release_status=$?
          set -e
          [[ "$release_status" -ne 0 ]] && grep -Eq 'HTTP(/[0-9.]+)? 404' <<< "$release_response" || { echo "remote release is not explicitly absent" >&2; exit 1; }
      - name: Publish exact verified archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag_created_by_this_run=false
          release_create_started=false
          owned_release_id=""
          cleanup_failed_publication() {
            failure_status=$?
            set +e
            safe_to_delete_owned_tag=false
            if [[ "$release_create_started" == "false" ]]; then
              safe_to_delete_owned_tag=true
            elif [[ -n "$owned_release_id" ]]; then
              release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$owned_release_id" 2>/dev/null)
              release_status=$?
              if [[ "$release_status" -eq 0 ]]; then
                release_identity=$(RELEASE_JSON="$release_json" python3 -c 'import json,os; value=json.loads(os.environ["RELEASE_JSON"]); print(f"{value.get(\"id\")}:{value.get(\"tag_name\")}:{str(value.get(\"draft\")).lower()}")')
                if [[ "$release_identity" == "$owned_release_id:$TAG:true" ]] &&
                    gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$owned_release_id" >/dev/null; then
                  safe_to_delete_owned_tag=true
                fi
              fi
            fi
            if [[ "$tag_created_by_this_run" == "true" && "$safe_to_delete_owned_tag" == "true" ]]; then
              tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)
              if [[ "$tag_commit" == "$SOURCE_COMMIT" ]]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null
              fi
            fi
            exit "$failure_status"
          }
          trap cleanup_failed_publication ERR
          mapfile -t archives < <(find release-inputs -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          [[ "${#archives[@]}" -eq 3 ]] || { echo "candidate archive inventory is incomplete" >&2; exit 1; }
          checksums=$(find release-inputs -name SHA256SUMS -print -quit)
          [[ -n "$checksums" ]] || { echo "aggregate checksums missing" >&2; exit 1; }
          created_tag_commit=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_COMMIT" --jq '.object.sha')
          [[ "$created_tag_commit" == "$SOURCE_COMMIT" ]] || { echo "tag identity mismatch" >&2; exit 1; }
          tag_created_by_this_run=true
          confirmed_tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          [[ "$confirmed_tag_commit" == "$SOURCE_COMMIT" ]] || { echo "tag readback mismatch" >&2; exit 1; }
          release_create_started=true
          gh release create "$TAG" --verify-tag --draft --title "AO Sentinel $VERSION" --notes-file "docs/release/V$VERSION-OPERATOR-CLOSEOUT.md" "${archives[@]}" "$checksums"
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os

          release = json.loads(os.environ["RELEASE_JSON"])
          expected_assets = {
              f"ao-sentinel-{os.environ['VERSION']}-linux-x86_64.tar.gz",
              f"ao-sentinel-{os.environ['VERSION']}-macos-aarch64.tar.gz",
              f"ao-sentinel-{os.environ['VERSION']}-windows-x86_64.zip",
              "SHA256SUMS",
          }
          actual_assets = {asset.get("name") for asset in release.get("assets", [])}
          if (release.get("tag_name") != os.environ["TAG"] or
                  release.get("draft") is not True or
                  actual_assets != expected_assets):
              raise SystemExit("staged draft release inventory mismatch")
          PY
          owned_release_id=$(RELEASE_JSON="$release_json" python3 -c 'import json,os; print(json.loads(os.environ["RELEASE_JSON"])["id"])')
          [[ "$owned_release_id" =~ ^[0-9]+$ ]] || { echo "staged draft release identity missing" >&2; exit 1; }
          gh release edit "$TAG" --draft=false --latest
          trap - ERR

  verify-published-release:
    name: independently-verify-published-assets
    needs: [assemble-plan, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download immutable plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ao-sentinel-release-rehearsal-plan-${{ inputs.source_commit }}
          path: plan
      - name: Read back exact tag and public assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_ref=$(git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG")
          [[ "$(printf '%s\n' "$tag_ref" | awk 'NF == 2 {count++} END {print count + 0}')" -eq 1 ]] || { echo "published tag inventory mismatch" >&2; exit 1; }
          [[ "$(printf '%s\n' "$tag_ref" | awk 'NF == 2 {print $1}')" == "$SOURCE_COMMIT" ]] || { echo "published tag source mismatch" >&2; exit 1; }
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os

          release = json.loads(os.environ["RELEASE_JSON"])
          if (release.get("tag_name") != os.environ["TAG"] or
                  release.get("draft") is not False or
                  release.get("prerelease") is not False):
              raise SystemExit("published release metadata mismatch")
          PY
          mkdir public-assets
          gh release download "$TAG" --dir public-assets
          PLAN=plan/immutable-promotion-plan.json python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          plan = json.loads(Path(os.environ["PLAN"]).read_text(encoding="utf-8"))
          expected = {candidate["archive"]: candidate["archive_sha256"] for candidate in plan["candidates"]}
          expected["SHA256SUMS"] = None
          actual = {path.name: path for path in Path("public-assets").iterdir() if path.is_file()}
          if set(actual) != set(expected):
              raise SystemExit("published asset inventory mismatch")
          for name, digest in expected.items():
              if digest is not None and hashlib.sha256(actual[name].read_bytes()).hexdigest() != digest:
                  raise SystemExit("published archive digest mismatch")
          lines = actual["SHA256SUMS"].read_text(encoding="ascii").splitlines()
          if lines != [f"{expected[name]}  {name}" for name in sorted(expected) if name != "SHA256SUMS"]:
              raise SystemExit("published checksum content mismatch")
          readback = {"schema_version": "ao.sentinel.release-published-readback.v0.1", "source_commit": plan["source_commit"], "tag": plan["tag"], "version": plan["version"], "asset_count": len(actual), "status": "passed"}
          Path("published-release-readback.json").write_text(json.dumps(readback, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload post-release readback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ao-sentinel-published-release-readback-${{ inputs.source_commit }}
          path: published-release-readback.json
          overwrite: false
          if-no-files-found: error
